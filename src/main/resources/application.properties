spring.application.name=asset-management
server.port=${PORT:8080}

# Database Configuration (Uses environment variables for deployment / Aiven cloud database)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME:avnadmin}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# JWT Security Configuration (Environment variable driven)
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000
